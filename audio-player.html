<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132d25">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Training Audio</title>
  <style>
    :root{--bg:#101713;--panel:#17231e;--text:#f4f7f5;--muted:#b9c6c0;--accent:#7bc2a7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:720px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
    a{color:var(--accent)}
    .back{display:inline-block;margin-bottom:28px;text-decoration:none;font-weight:700}
    .card{background:var(--panel);border-radius:18px;padding:24px;box-shadow:0 12px 40px #0006}
    .eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;margin:0 0 8px}
    h1{font-size:1.55rem;line-height:1.2;margin:0 0 10px}
    .hint{color:var(--muted);margin:0 0 24px}
    audio{display:block;width:100%}
  </style>
</head>
<body>
<main>
  <a class="back" href="./">← Back to Learning Hub</a>
  <section class="card">
    <p class="eyebrow">Audio overview</p>
    <h1 id="title">Training audio</h1>
    <p class="hint" id="hint">Use the native controls to play, pause, seek, or change playback speed.</p>
    <audio id="audio" controls preload="metadata"></audio>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search);
const source=params.get("src")||"";
const title=params.get("title")||"Training audio";
if(!/^[a-z0-9][a-z0-9._-]*\.(m4a|mp3|wav|ogg)$/i.test(source)) {
  document.getElementById("hint").textContent="This audio link is invalid.";
} else {
  document.getElementById("audio").src=source;
}
document.getElementById("title").textContent=title;
document.title=title+" – Learning Hub";
</script>
</body>
</html>
